<!--
    DOCTYPE tells the browser that this document uses HTML5.
    It helps the browser render the page using modern HTML standards.
-->
<!DOCTYPE html>

<!--
    <html> is the root (main) element of the entire HTML document.
    lang="en" tells the browser that the page's main language is English.
-->
<html lang="en">

<head>

    <!--
        <meta charset="UTF-8">
        Tells the browser how to interpret characters on the webpage.
        UTF-8 supports English, ₹, €, emojis, accented characters, etc.
    -->
    <meta charset="UTF-8">

    <!--
        Viewport meta tag makes the website responsive on different devices.

        width=device-width
        → Makes the webpage width match the device's screen width.

        initial-scale=1.0
        → Opens the webpage at normal/100% zoom.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!--
        <title> defines the title of the webpage.
        It appears in the browser tab.
    -->
    <title>AI Automation Agency</title>
<!--
    <link> connects an external resource to our HTML page.

    rel="stylesheet"
    → Tells the browser that the linked file is a CSS stylesheet.

    href="style.css"
    → Tells the browser where our CSS file is located.
-->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!--
        <body> contains everything that the visitor can see
        on the webpage.
    -->

    <!--
        <h1> is the main/most important heading of the page.
        Generally, a page should have one main <h1>.
    -->
    <h1>AI Automation Agency</h1>

    <!--
        <p> creates a paragraph of text.
    -->
    <p>
        We build modern websites and AI-powered automation for businesses.
    </p>

    <!--
        <button> creates a clickable button.
        Later, JavaScript can be used to make this button perform an action.
    -->
    <button>Get Started</button>
<!--
    <script> connects JavaScript to our HTML page.

    src="script.js"
    → Tells the browser where our JavaScript file is.
-->
    <script src="script.js"></script>
</body>

</html>
